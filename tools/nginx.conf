server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Static tools suite — no server-side logic, just files.
    # gzip module stays off: data/*.bin.gz is already gzipped and decompressed
    # client-side via DecompressionStream(); an on-the-fly gzip pass here would
    # double-compress it and break that.

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|json|bin|gz)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
